[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hackinvent-kicad-mcp"
version = "0.2.0"
description = "A KiCad IPC plugin and Model Context Protocol server for the PCB editor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HackInvent"}]
keywords = ["kicad", "mcp", "pcb", "electronics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "kicad-python>=0.7.1,<0.8",
    "mcp>=1.28,<2",
    "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
kicad-mcp = "kicad_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/HackInvent/kicad-mcp"
Repository = "https://github.com/HackInvent/kicad-mcp"
Issues = "https://github.com/HackInvent/kicad-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
